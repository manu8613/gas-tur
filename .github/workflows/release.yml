name: Release

# Igual que en centro-control: cuando llega a main una versión nueva en
# manifest.json, se crea la etiqueta vX.Y.Z y la release con sus notas del
# CHANGELOG y el ZIP. HACS deja instalar cualquier versión publicada.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ¿Versión nueva?
        id: v
        run: |
          V=$(python3 -c "import json;print(json.load(open('custom_components/gas_tur/manifest.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "La versión v$V ya está publicada."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            grep -q "^## \[$V\]" CHANGELOG.md || { echo "Falta el apartado [$V] en CHANGELOG.md"; exit 1; }
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.v.outputs.new == 'true'
        with:
          python-version: "3.14"
      - name: Tests antes de publicar
        if: steps.v.outputs.new == 'true'
        run: |
          pip install -r requirements_test.txt
          pytest -q
      - name: Notas de la versión
        if: steps.v.outputs.new == 'true'
        run: |
          python3 - <<'PY'
          import re
          v = "${{ steps.v.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(v)}\].*?$(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "")
          body += "\n\n---\nGas TUR · creado por [manu8613](https://github.com/manu8613)"
          open("NOTES.md", "w", encoding="utf-8").write(body)
          PY
      - name: ZIP de la integración
        if: steps.v.outputs.new == 'true'
        run: cd custom_components/gas_tur && zip -r ../../gas_tur.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gas TUR v${{ steps.v.outputs.version }}
          body_path: NOTES.md
          files: gas_tur.zip
          make_latest: true
