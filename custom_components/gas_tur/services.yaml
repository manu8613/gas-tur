nueva_factura:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gas_tur
    fecha:
      required: true
      selector:
        date:
    lectura:
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          step: 0.01
          mode: box
          unit_of_measurement: "m³"
    factor_conversion:
      selector:
        number:
          min: 5
          max: 15
          step: 0.001
          mode: box
          unit_of_measurement: "kWh/m³"
ajustar_lectura:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gas_tur
    lectura:
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          step: 0.01
          mode: box
          unit_of_measurement: "m³"
establecer_precio:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gas_tur
    fecha:
      required: true
      selector:
        date:
    termino_fijo:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
          unit_of_measurement: "€/mes"
    termino_variable:
      required: true
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box
          unit_of_measurement: "€/kWh"
actualizar_precios:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gas_tur
crear_panel:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gas_tur
